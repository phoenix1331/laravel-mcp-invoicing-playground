  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: composer audit
        run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install npm dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # Psalm's taint analysis, not Larastan (already run in a separate job
      # at level 8 for correctness/type-safety) - this pass is specifically
      # for SQL injection, XSS, command injection and path traversal.
      - name: psalm taint analysis
        run: ./vendor/bin/psalm --taint-analysis --no-progress

  osv-scan:
    name: osv-scanner
    # security-events: write is required here even though upload-sarif is off
    # below - the called reusable workflow's own permissions block requests
    # it unconditionally, and a caller can only downgrade what a reusable
    # workflow requests, never grant it less than it asks for. Omitting this
    # makes GitHub reject the whole run at startup (a startup_failure with
    # zero jobs ever queued), not just fail this one job.
    permissions:
      contents: read
      actions: read
      security-events: write
    # Reusable workflow, called at job level rather than as a step - it
    # auto-detects both composer.lock and package-lock.json from a single
    # recursive scan of the repo root. Pinned by tag rather than commit SHA -
    # no known compromise of this action's tags, unlike aquasecurity/trivy-action
    # above, but pinning by SHA is still the stricter general practice worth
    # revisiting before this repo is relied on for anything beyond a demo.
    # upload-sarif is off because GitHub code scanning needs Advanced Security,
    # which is not available on a private repo without a paid plan; the scan
    # itself still runs and still fails the job on a real vulnerability via
    # fail-on-vuln, which stays at its default of true.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      upload-sarif: false

  auth-audit:
    name: auth audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: copy env
        run: cp .env.example .env

      - name: generate app key
        run: php artisan key:generate

      - name: run auth-audit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan auth-audit:run --min=90 --html=storage/auth-audit/report.html --compare=auth-audit-baseline.json

      - name: upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-audit-report
          path: storage/auth-audit/report.html

  docs:
    name: build & deploy docs
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: copy env
        run: cp .env.example .env

      - name: generate app key
        run: php artisan key:generate

      - name: generate capability map
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan docs:capability-map

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: deploy to github pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: note if the deploy was skipped
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deploy failed - likely because the repository is private (Pages needs a paid plan on a private repo) or Pages has not been enabled yet under Settings > Pages > Source: GitHub Actions. The docs build itself succeeded."
