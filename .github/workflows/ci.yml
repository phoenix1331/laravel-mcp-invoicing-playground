name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: composer validate
        run: composer validate --strict

      - name: pint
        run: ./vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install npm dependencies
        run: npm ci

      - name: prettier
        run: npm run lint

  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: larastan
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=512M

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install npm dependencies
        run: npm ci

      - name: build assets
        run: npm run build

      - name: copy env
        run: cp .env.example .env

      - name: generate app key
        run: php artisan key:generate

      - name: generate passport keys
        run: php artisan passport:keys

      - name: run pest
        run: ./vendor/bin/pest

  e2e:
    name: e2e (dusk)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DB_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laravel_dusk
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install npm dependencies
        run: npm ci

      - name: build assets
        run: npm run build

      - name: copy dusk env
        run: cp .env.dusk.testing .env

      - name: generate app key
        run: php artisan key:generate

      - name: migrate and seed
        run: php artisan migrate:fresh --seed --force

      - name: cache chrome driver
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: chromedriver-${{ runner.os }}

      - name: install chromedriver
        run: php artisan dusk:chrome-driver --detect

      - name: start the app server
        run: php artisan serve --no-reload &

      - name: run dusk
        run: php artisan dusk

      - name: upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots

      - name: upload console logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-console
          path: tests/Browser/console

  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: composer audit
        run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install npm dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # Psalm's taint analysis, not Larastan (already run in a separate job
      # at level 8 for correctness/type-safety) - this pass is specifically
      # for SQL injection, XSS, command injection and path traversal.
      - name: psalm taint analysis
        run: ./vendor/bin/psalm --taint-analysis --no-progress

  osv-scan:
    name: osv-scanner
    permissions:
      contents: read
      security-events: write
      actions: read
    # Reusable workflow, called at job level rather than as a step - it
    # auto-detects both composer.lock and package-lock.json from a single
    # recursive scan of the repo root. Pinned by tag rather than commit SHA -
    # no known compromise of this action's tags, unlike aquasecurity/trivy-action
    # above, but pinning by SHA is still the stricter general practice worth
    # revisiting before this repo is relied on for anything beyond a demo.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        # CodeQL has no PHP language support (confirmed against GitHub's own
        # supported-languages list, still unaddressed as a long-standing
        # upstream gap) - PHP is scanned separately in the security-scan job.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  auth-audit:
    name: auth audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: copy env
        run: cp .env.example .env

      - name: generate app key
        run: php artisan key:generate

      - name: run auth-audit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan auth-audit:run --min=90 --html=storage/auth-audit/report.html --compare=auth-audit-baseline.json

      - name: upload html report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-audit-report
          path: storage/auth-audit/report.html

  docs:
    name: build & deploy docs
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: copy env
        run: cp .env.example .env

      - name: generate app key
        run: php artisan key:generate

      - name: generate capability map
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan docs:capability-map

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: deploy to github pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: note if the deploy was skipped
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deploy failed - likely because the repository is private (Pages needs a paid plan on a private repo) or Pages has not been enabled yet under Settings > Pages > Source: GitHub Actions. The docs build itself succeeded."
