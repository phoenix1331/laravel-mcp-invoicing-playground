services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - caddy-data:/data
    environment:
      SERVER_NAME: "http://localhost:8000${TUNNEL_HOSTNAME:+, }${TUNNEL_HOSTNAME:-}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  caddy-data:
